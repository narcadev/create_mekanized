# Standard TOML format, v0.5.0.

modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}" #mandatory

issueTrackerURL="https://github.com/narcadev/create_mekanized/issues" #optional

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

displayURL="https://github.com/narcadev/create_mekanized" #optional

#logoFile="create_mekanized.png" #optional

#credits="" #optional

authors="narcadev" #mandatory

# mandatory
description='''
A mod that attempts to bridge the gap between Create and Mekanism.
'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config="${mod_id}.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# Neoforge
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# Minecraft
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Create
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.11,)"
    ordering="AFTER"
    side="BOTH"

# Mekanism
[[dependencies.${mod_id}]]
    modId="mekanism"
    type="required"
    versionRange="[10.7.19,)"
    ordering="AFTER"
    side="BOTH"


#[features.${mod_id}]
#openGLVersion="[3.2,)"